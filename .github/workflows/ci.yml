name: ci

on:
  push:
  pull_request:

jobs:
  python-sqlite:
    runs-on: ubuntu-latest
    env:
      NOVELHOG_SKIP_WEB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: scripts/check.sh

  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: novelhog-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NOVELHOG_TEST_DATABASE_URL: postgresql+psycopg://postgres:novelhog-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/integration tests/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOVELHOG_CONTAINER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: docker compose -f compose.yaml -f compose.test.yaml build
      - run: uv run pytest tests/container -q
