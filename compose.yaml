# novelhog: one Dockerfile, three roles, plus a FlareSolverr paired 1:1 with the worker (spec section 2).
# Scale by adding worker/FlareSolverr pairs in an override file, never with `--scale`.

# No shared `image:` tag: each service gets its own image (`<project>-<service>`), so a watch rebuild
# of one service never changes another's image, which made Compose recreate and leave it stopped.
x-novelhog: &novelhog
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &novelhog-env
    NOVELHOG_DATABASE_URL: ${NOVELHOG_DATABASE_URL:-sqlite:////data/db/app.db}
    NOVELHOG_PUBLIC_URL: ${NOVELHOG_PUBLIC_URL:-}
    NOVELHOG_VAPID_SUBJECT: ${NOVELHOG_VAPID_SUBJECT:-}
    NOVELHOG_ALLOWED_HOSTS: ${NOVELHOG_ALLOWED_HOSTS:-}
    NOVELHOG_HTTP_PORT: ${NOVELHOG_HTTP_PORT:-8080}

services:
  novelhog-migrate:
    <<: *novelhog
    command: ["db", "migrate"]
    restart: "no"
    volumes:
      - novelhog-db:/data/db

  novelhog-web:
    <<: *novelhog
    command: ["web"]
    restart: unless-stopped
    depends_on:
      novelhog-migrate:
        condition: service_completed_successfully
    ports:
      - "${NOVELHOG_HTTP_PORT:-8080}:${NOVELHOG_HTTP_PORT:-8080}"
    volumes:
      - novelhog-db:/data/db
      - novelhog-static:/data/static:ro
    # `docker compose up --watch`: the SPA, Caddy and the API live here, so this rebuilds only for them.
    develop:
      watch:
        - path: web
          action: rebuild
          ignore: [node_modules/, dist/, test-results/, playwright-report/, e2e/]
        - path: docker/Caddyfile
          action: rebuild
        - &watch-python
          path: src
          action: rebuild
          ignore: [__pycache__/]
        - &watch-lock
          path: uv.lock
          action: rebuild
        - &watch-pyproject
          path: pyproject.toml
          action: rebuild
        - &watch-dockerfile
          path: docker/Dockerfile
          action: rebuild

  novelhog-worker:
    <<: *novelhog
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      novelhog-migrate:
        condition: service_completed_successfully
    environment:
      <<: *novelhog-env
      NOVELHOG_FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - novelhog-db:/data/db
      - novelhog-static:/data/static
    networks:
      - default
      - worker-pair
    # Python changes only; a web or Caddyfile change leaves the worker (and its downloads) running.
    develop:
      watch: [*watch-python, *watch-lock, *watch-pyproject, *watch-dockerfile]

  # No depends_on from the worker: while this is down the worker reports an infrastructure error.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    networks:
      - worker-pair

networks:
  worker-pair: {}

volumes:
  novelhog-db:
  novelhog-static:
