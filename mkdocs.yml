site_name: novelhog
site_description: Self-hosted web-novel downloader and reader, with a web UI, a worker and EPUB export.
site_url: https://t3hk0d3.github.io/novelhog/
repo_url: https://github.com/t3hk0d3/novelhog
repo_name: t3hk0d3/novelhog

docs_dir: docs
exclude_docs: |
  superpowers/
  logo/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Reader: reader.md
  - Install: install.md
  - Configuration: configuration.md
  - Reverse proxy: reverse-proxy.md
  - Storage and upgrades: storage.md
  - Development: development.md
